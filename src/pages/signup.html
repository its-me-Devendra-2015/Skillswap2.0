<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signup — SkillSwap</title><link rel="stylesheet" href="css/style.css"></head><body data-page="signup"><header class="topbar"><div class="nav-inner"><a class="brand" href="index.html"><span class="brand-mark">S</span><span>Skill<span class="accent-text">Swap</span></span></a><nav id="mainNav"></nav><div id="authArea"></div><button class="menu-btn" id="menuBtn">☰</button></div></header><main><section class="container page"><div class="page-title"><div class="eyebrow">JOIN SKILLSWAP</div><h2>Create your account</h2><p class="kicker">Create a real user record for this prototype. Passwords are not stored by this demo; use Firebase Auth or another proper auth provider before public deployment.</p></div><form id="signupForm" class="form-card"><div class="field"><label>Name</label><input id="name" required></div><div class="field"><label>Username</label><input id="username" placeholder="Choose a public username"></div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" minlength="6" required></div><div class="field"><label>Skills you can teach</label><input id="teach" placeholder="Photoshop, Python, Cricket"></div><div class="field"><label>Skills you want to learn</label><input id="learn" placeholder="Blender, Figma"></div><button class="btn primary full">Create account</button></form></section></main><footer class="footer"><div class="footer-inner"><div><span class="brand-mark small">S</span> SkillSwap</div><div>Prototype-ready • Real user records only • Backend-ready data layer</div></div></footer><div id="toast" class="toast"></div><div id="modal" class="modal hidden"><div class="modal-box"><button class="close" id="closeModal">×</button><div id="modalContent"></div></div></div><script src="js/app.js"></script></body></html>
