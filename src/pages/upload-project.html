<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload Project — SkillSwap</title><link rel="stylesheet" href="css/style.css"></head><body data-page="upload"><header class="topbar"><div class="nav-inner"><a class="brand" href="index.html"><span class="brand-mark">S</span><span>Skill<span class="accent-text">Swap</span></span></a><nav id="mainNav"></nav><div id="authArea"></div><button class="menu-btn" id="menuBtn">☰</button></div></header><main><section class="container page"><div class="page-title"><div class="eyebrow">PROJECT SHARING</div><h2>Upload a project</h2><p class="kicker">Share what you made, the tools you used and an optional preview image.</p></div><form id="uploadForm" class="form-card"><div class="two"><div class="field"><label>Project title</label><input id="title" placeholder="e.g. Smart Plant Monitor" required></div><div class="field"><label>Category</label><input id="category" placeholder="Robotics"></div></div><div class="field"><label>Icon</label><input id="icon" maxlength="4" placeholder="🤖"></div><div class="field"><label>Description</label><textarea id="description" placeholder="What did you build?"></textarea></div><div class="field"><label>Skills / tools used</label><input id="tools" placeholder="ESP32, JavaScript, sensors"></div><div class="field"><label>Preview image (optional)</label><input id="image" type="file" accept="image/*"></div><button class="btn primary full">Publish project</button></form></section></main><footer class="footer"><div class="footer-inner"><div><span class="brand-mark small">S</span> SkillSwap</div><div>Prototype-ready • Real user records only • Backend-ready data layer</div></div></footer><div id="toast" class="toast"></div><div id="modal" class="modal hidden"><div class="modal-box"><button class="close" id="closeModal">×</button><div id="modalContent"></div></div></div><script src="js/app.js"></script></body></html>
